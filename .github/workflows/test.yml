name: Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo and target dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test